<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Now</title>
  <style>
    body { font-family: Arial, sans-serif; background: #0d0d0d; color: #fff; margin: 0; padding: 15px; text-align: center; }
    .banner { max-width: 728px; min-height: 80px; margin: 12px auto; background: #1b1b1b; display: flex; align-items: center; justify-content: center; }
    .player { max-width: 800px; margin: 15px auto; aspect-ratio: 16/9; background: #000; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <h3 id="titleText">Loading...</h3>

  <!-- TOP BANNER AD CODE YAHAN -->
  <div class="banner">Top Banner Here</div>

  <!-- VIDHIDE PLAYER -->
  <div class="player">
    <iframe id="playerFrame" allowfullscreen></iframe>
  </div>

  <!-- BOTTOM BANNER AD CODE YAHAN -->
  <div class="banner">Bottom Banner Here</div>

  <p style="font-size:13px; color:#aaa;">Bookmark this page to visit again easily.</p>
  <a href="index.html" style="color:#fff;">Back Home</a>

  <script>
    const p = new URLSearchParams(window.location.search);
    document.getElementById("titleText").innerText = p.get("title") || "Video";
    document.getElementById("playerFrame").src = p.get("url") || "";
  </script>

</body>
</html>
