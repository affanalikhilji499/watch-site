<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Now</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(circle at top, #1c1414 0%, #0b0b0e 65%);
      color: #f5f5f7;
      margin: 0;
      padding: 18px 14px 40px;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .back-link {
      color: #e4e4e7;
      text-decoration: none;
      font-size: 14px;
      background: #18181f;
      border: 1px solid rgba(255,255,255,0.12);
      padding: 8px 14px;
      border-radius: 8px;
    }
    .back-link:hover { border-color: #ff2e4d; }
    #titleText {
      margin: 0 0 14px;
      font-size: 20px;
      font-weight: 700;
      text-align: left;
    }
    .banner {
      max-width: 728px;
      min-height: 84px;
      margin: 14px auto;
      background: #14141a;
      border: 1px dashed rgba(255,255,255,0.16);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #71717a;
      font-size: 12px;
    }
    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 14px 34px rgba(0,0,0,0.55);
    }
    iframe { width: 100%; height: 100%; border: none; }
    .tip {
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: #a1a1aa;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <a class="back-link" href="index.html">&larr; All Videos</a>
      <span style="font-size:13px; font-weight:700; color:#ff2e4d;">WATCHHUB</span>
    </div>

    <h1 id="titleText">Loading...</h1>

    <!-- TOP BANNER AD CODE YAHAN -->
    <div class="banner">Top Banner Here</div>

    <!-- VIDHIDE PLAYER -->
    <div class="player">
      <iframe id="playerFrame" allowfullscreen></iframe>
    </div>

    <!-- BOTTOM BANNER AD CODE YAHAN -->
    <div class="banner">Bottom Banner Here</div>

    <p class="tip">Bookmark this page or add to Home Screen to come back anytime.</p>
  </div>

  <script>
    const p = new URLSearchParams(window.location.search);
    const title = p.get("title") || "Watch Video";
    document.title = title;
    document.getElementById("titleText").innerText = title;
    document.getElementById("playerFrame").src = p.get("url") || "";
  </script>

</body>
</html>
