<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Hub</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(circle at top, #1c1414 0%, #0b0b0e 65%);
      color: #f5f5f7;
      margin: 0;
      padding: 0 16px 40px;
      min-height: 100vh;
    }
    .topbar {
      max-width: 1060px;
      margin: 0 auto;
      padding: 20px 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .brand span { color: #ff2e4d; }
    .tagline {
      font-size: 12px;
      color: #a1a1aa;
    }
    .search-wrap {
      max-width: 540px;
      margin: 24px auto 28px;
    }
    #searchBox {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      color: #fff;
      background: #17171d;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    #searchBox:focus {
      border-color: #ff2e4d;
      box-shadow: 0 0 0 3px rgba(255, 46, 77, 0.2);
    }
    #searchBox::placeholder { color: #71717a; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 18px;
      max-width: 1060px;
      margin: 0 auto;
    }
    .card {
      background: #15151b;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 46, 77, 0.45);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.45);
    }
    .poster-wrap {
      width: 100%;
      aspect-ratio: 2 / 3;
      overflow: hidden;
      background: #202029;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.3s ease;
    }
    .card:hover img { transform: scale(1.04); }
    .card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
      gap: 10px;
    }
    .card h4 {
      margin: 0;
      font-size: 14px;
      font-weight: 600;
      line-height: 1.35;
      color: #f4f4f5;
    }
    .btn {
      display: block;
      text-align: center;
      padding: 9px 12px;
      background: linear-gradient(135deg, #ff2e4d, #d91b38);
      color: #fff;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      border-radius: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: #a1a1aa;
      padding: 40px 10px;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">WATCH<span>HUB</span></div>
    <div class="tagline">Fast Mobile Player</div>
  </header>

  <div class="search-wrap">
    <input type="text" id="searchBox" onkeyup="searchList()" placeholder="Search movie, clip, or scene...">
  </div>

  <div class="grid" id="listBox"></div>

  <script>
    const videos = [
      {
        title: "Sample Video 1",
        poster: "https://via.placeholder.com/300x450/22222c/ffffff?text=Poster+1",
        url: "https://vidhidepro.com/v/EXAMPLE1"
      }
    ];

    function showVideos(data) {
      const box = document.getElementById("listBox");
      if (!data.length) {
        box.innerHTML = `<div class="empty">No matching video found.</div>`;
        return;
      }
      box.innerHTML = data.map(v => {
        const link = "watch.html?title=" + encodeURIComponent(v.title) + "&url=" + encodeURIComponent(v.url);
        return `
          <article class="card">
            <div class="poster-wrap">
              <img src="${v.poster}" alt="${v.title}" loading="lazy">
            </div>
            <div class="card-body">
              <h4>${v.title}</h4>
              <a class="btn" href="${link}">Watch Now</a>
            </div>
          </article>
        `;
      }).join("");
    }

    function searchList() {
      const q = document.getElementById("searchBox").value.toLowerCase().trim();
      const filtered = videos.filter(v => v.title.toLowerCase().includes(q));
      showVideos(filtered);
    }

    showVideos(videos);
  </script>

</body>
</html>
